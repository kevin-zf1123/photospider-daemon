name: daemon-ci

on:
  push:
  pull_request:

jobs:
  installed-kernel-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify Ninja
        run: ninja --version
      - name: Select matching kernel branch
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone https://github.com/kevin-zf1123/photospider.git "$RUNNER_TEMP/kernel"
          if git -C "$RUNNER_TEMP/kernel" ls-remote --exit-code --heads origin "$branch"; then
            git -C "$RUNNER_TEMP/kernel" checkout --detach "origin/$branch"
          else
            git -C "$RUNNER_TEMP/kernel" checkout --detach origin/main
          fi
      - name: Build isolated kernel package
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/kernel" -B "$RUNNER_TEMP/kernel-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kernel-prefix" \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/kernel-build" --parallel
          cmake --install "$RUNNER_TEMP/kernel-build"
      - name: Configure daemon from installed public package
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/kernel-prefix
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test local orchestration and installed client
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit daemon-ctest.xml

  sanitizers:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Ninja
        run: ninja --version
      - name: Select matching kernel branch
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone https://github.com/kevin-zf1123/photospider.git "$RUNNER_TEMP/kernel"
          if git -C "$RUNNER_TEMP/kernel" ls-remote --exit-code --heads origin "$branch"; then
            git -C "$RUNNER_TEMP/kernel" checkout --detach "origin/$branch"
          else
            git -C "$RUNNER_TEMP/kernel" checkout --detach origin/main
          fi
      - name: Build isolated kernel package
        shell: bash
        run: |
          option="PHOTOSPIDER_ENABLE_${{ matrix.sanitizer }}"
          cmake -S "$RUNNER_TEMP/kernel" -B "$RUNNER_TEMP/kernel-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kernel-prefix" \
            -DBUILD_TESTING=OFF \
            -D"$option"=ON
          cmake --build "$RUNNER_TEMP/kernel-build" --parallel
          cmake --install "$RUNNER_TEMP/kernel-build"
      - name: Configure daemon sanitizer
        shell: bash
        run: |
          option="PHOTOSPIDER_DAEMON_ENABLE_${{ matrix.sanitizer }}"
          cmake -S . -B "build-${{ matrix.sanitizer }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/kernel-prefix" \
            -DBUILD_TESTING=ON \
            -D"$option"=ON
      - name: Build focused sanitizer targets
        run: >-
          cmake --build build-${{ matrix.sanitizer }} --parallel
          --target test_ipc_codec test_sigpipe_transport test_local_daemon
          test_socket_ownership test_photospiderd_signals
      - name: Run focused sanitizer tests
        run: >-
          ctest --test-dir build-${{ matrix.sanitizer }} --output-on-failure
          -R 'test_(ipc_codec|sigpipe_transport|local_daemon|socket_ownership|photospiderd_(sigint|sigterm_delayed|rpc_shutdown))$'
